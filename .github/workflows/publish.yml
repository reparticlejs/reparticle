name: Release

on:
  workflow_run:
    workflows: [Checks]
    types: [completed]
    branches: [main]

permissions:
  contents: read

env:
  HUSKY: 0

# Serialize releases without interrupting a publication already in progress.
concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  select:
    # workflow_run also fires for failed checks. Only successful main pushes
    # from this repository may enter the release flow, never PR or fork runs.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
      plan: ${{ steps.mode.outputs.publish-plan-artifact-id }}
    steps:
      - uses: actions/checkout@v6.1.0
        with:
          # Use the checked commit, even if main moved while the job was queued.
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up workspace
        uses: $/.github/actions/setup
        with:
          ignore-scripts: 'true'
      # Do not release an older successful run after a newer commit reaches main.
      - name: Require the current main commit
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE: ${{ github.event.workflow_run.head_sha }}
        run: |
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          test "$current" = "$CANDIDATE"
      - name: Select versioning or publication
        id: mode
        uses: changesets/action/select-mode@v2.1.2

  version:
    needs: select
    if: needs.select.outputs.mode == 'version'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6.1.0
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up workspace
        uses: $/.github/actions/setup
        with:
          ignore-scripts: 'true'
      - name: Create or update the release pull request
        id: version
        uses: changesets/action/version@v2.1.2
        with:
          pr-base-branch: main
          pr-title: Prepare the next reparticle release
          script: pnpm release:version
      # GITHUB_TOKEN-created PRs do not trigger pull_request workflows automatically.
      - name: Check the release pull request
        if: steps.version.outputs.pr-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.version.outputs.pr-number }}
        run: |
          head=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq .head.ref)
          gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/check.yml/dispatches" -f ref="$head"

  # Build and verify without npm publishing permissions. Pass the packed artifact
  # to a separate publishing job rather than rebuilding with elevated permissions.
  pack:
    needs: select
    if: needs.select.outputs.mode == 'publish'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      artifact: ${{ steps.pack.outputs.pack-dir-artifact-id }}
    steps:
      - uses: actions/checkout@v6.1.0
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up workspace
        uses: $/.github/actions/setup
        with:
          browser: 'true'
      - run: pnpm build
      - name: Verify packed packages in a separate application
        run: pnpm packages:check
      - name: Pack the release candidate
        id: pack
        uses: changesets/action/pack@v2.1.2
        with:
          publish-plan-artifact-id: ${{ needs.select.outputs.plan }}

  # The repository variable is an explicit publication switch. OIDC below
  # authenticates to npm through trusted publishing, without a stored npm token.
  publish:
    needs: [select, pack]
    if: needs.select.outputs.mode == 'publish' && vars.NPM_TRUSTED_PUBLISHING == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6.1.0
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up workspace
        uses: $/.github/actions/setup
        with:
          ignore-scripts: 'true'
      # Recheck after packing: main may have advanced since the select job.
      - name: Require the current main commit
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE: ${{ github.event.workflow_run.head_sha }}
        run: |
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          test "$current" = "$CANDIDATE"
      - name: Publish through npm trusted authentication
        uses: changesets/action/publish@v2.1.2
        with:
          pack-dir-artifact-id: ${{ needs.pack.outputs.artifact }}
          create-github-releases: true
          push-git-tags: true
