name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  HUSKY: '0'
  SITE_URL: ${{ vars.SITE_URL || 'https://reparticlejs.github.io' }}
  SITE_BASE: ${{ vars.SITE_BASE || '/reparticle/' }}

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Release checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Capabilities are declared here; steps below do not infer them from OS names.
        include:
          - os: ubuntu-24.04
            renderer: software
            webgpu: false
            verify-lockfile: true
            upload-site: true
          - os: windows-2025
            renderer: software
            webgpu: false
            verify-lockfile: false
            upload-site: false
          - os: macos-26
            renderer: metal
            webgpu: true
            verify-lockfile: false
            upload-site: false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      # Hosted Linux/Windows lack a reliable GPU adapter. Software WebGL2 keeps
      # their browser coverage; macOS uses native Metal for backend comparisons.
      REPARTICLE_TEST_RENDERER: ${{ matrix.renderer }}
    steps:
      - uses: actions/checkout@v6.1.0
        with:
          persist-credentials: false
      # Verify once per matrix: lockfile coverage and upstream commit identity.
      - name: Verify Actions lockfile
        if: matrix.verify-lockfile
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh extension install github/gh-actions-lock --pin v0.4.0
          gh actions-lock --verify
      - name: Set up workspace
        uses: $/.github/actions/setup
        with:
          browser: 'true'
      - name: Check formatting, lint, types, common tests, and builds
        run: pnpm check
      # WebGPU is required here, not silently skipped when an adapter is missing.
      # This is a hosted-runner limitation, not a limit on supported user platforms.
      - name: WebGPU tests
        if: matrix.webgpu
        run: pnpm test:webgpu
      - name: Verify packed packages in a separate application
        run: pnpm packages:check
      # Upload once; deployment below still waits for all three OS checks.
      - name: Upload Pages site
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && matrix.upload-site && vars.PAGES_ENABLED == 'true'
        uses: actions/upload-pages-artifact@v3.0.1
        with:
          path: site/dist

  deploy-pages:
    name: Deploy documentation and examples
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.PAGES_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - name: Deploy Pages site
        id: deployment
        uses: actions/deploy-pages@v4.0.5
